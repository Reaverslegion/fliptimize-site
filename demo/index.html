<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fliptimize — demo</title>
<meta name="robots" content="noindex">
<style>
/* v3: FlipScout navy + ONE green; amber only for warnings. Type scale 12/14/16/20/28. Tap targets 44px+ */
:root{--bg:#EEF2F8;--card:#FFFFFF;--card2:#E6ECF4;--tx:#0B1430;--mu:#4A5670;--bd:#D3DCE9;--green:#15803D;--greenbg:#E3F6EA;--warn:#8A4B00;--warnbg:#FFF1D6;--red:#B42318;
 --btn:#15803D;--onbtn:#FFFFFF;--brand:#0D172C;--brandtx:#FFFFFF;--navmu:#A3B2CF;--navac:#4ADE80;--logo:linear-gradient(135deg,#7fdca4,#b3cf9a);--shadow:0 1px 2px rgba(8,18,42,.06),0 4px 14px rgba(8,18,42,.06);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0B111F;--card:#151E33;--card2:#1D2840;--tx:#EEF2FB;--mu:#A3B2CF;--bd:#28344F;--green:#4ADE80;--greenbg:#12301F;--warn:#F7C14F;--warnbg:#3A2F14;--red:#F87171;
 --btn:#22C55E;--onbtn:#04140A;--brand:#0D172C;--brandtx:#EEF2FB;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:8px}
.t12{font-size:12px}.t14{font-size:14px}.t16{font-size:16px}.t20{font-size:20px;letter-spacing:-.2px}.t28{font-size:28px;letter-spacing:-.6px}
.b{font-weight:700}.mu{color:var(--mu)}.green{color:var(--green)}.num{font-variant-numeric:tabular-nums}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.demo{font-size:12px;text-align:center;padding:4px;background:var(--warnbg);color:var(--warn);font-weight:600}
.brandbar{background:var(--brand)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:640px;margin:auto;min-height:56px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.5px;flex:1;color:var(--brandtx)}
.brand b{background:var(--logo);-webkit-background-clip:text;background-clip:text;color:transparent}
.hsub{font-size:14px;color:var(--navmu)}
main{padding:12px 16px 16px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.list{padding:0 16px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:14px;background:var(--btn);color:var(--onbtn);font-weight:700;font-size:16px;padding:12px 16px}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.link{background:none;color:var(--green);min-height:48px;margin-top:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--bd);background:var(--card);font-size:14px;font-weight:600}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.w{border-color:var(--warn);color:var(--warn);background:var(--warnbg)}
@media (prefers-color-scheme:dark){.chip.on{background:var(--green);border-color:var(--green);color:var(--onbtn)}}
.sortb{min-height:44px;font-size:14px;color:var(--mu)}.sortb b{color:var(--tx)}
/* slim deal row */
.rows .deal+.deal{border-top:1px solid var(--bd)}
.deal{display:flex;gap:12px;align-items:center;padding:14px 0;cursor:pointer}
.thumb{width:64px;height:64px;border-radius:12px;background:var(--card2);flex:none;display:grid;place-items:center;font-size:12px;color:var(--mu)}
.dmid{flex:1;min-width:0}
.dtitle{font-size:16px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dsub{font-size:14px;color:var(--mu);margin-top:2px}.dsub b{color:var(--tx)}
.dmeta{font-size:12px;color:var(--mu);margin-top:4px;display:flex;gap:4px;align-items:center}
.dright{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end}
.profit{font-size:20px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums;line-height:1.1}
.plab{font-size:12px;color:var(--mu)}
.more{width:44px;height:44px;display:grid;place-items:center;margin:-4px -12px -10px 0;color:var(--mu)}
.more svg,.iconb svg{width:22px;height:22px;fill:currentColor;stroke:currentColor;stroke-width:0}
.lab{display:inline-block;font-size:12px;font-weight:700;padding:0 6px;border-radius:6px;border:1px solid var(--bd);color:var(--tx);margin-right:2px}
.score{font-weight:700}.score.s1{color:var(--green)}.score.s2{color:var(--warn)}.score.s3{color:var(--red)}
/* deal page */
.topbar{position:sticky;top:0;z-index:4;display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:var(--bg);max-width:640px;margin:auto}
.iconb{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.iconb svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.iconb:last-child svg{fill:currentColor;stroke-width:0}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 16px;padding:0 16px;scrollbar-width:none}
.gal div{flex:none;width:88%;height:240px;border-radius:16px;background:var(--card2);scroll-snap-align:center;display:grid;place-items:center;color:var(--mu);font-size:14px}
.scorebtn{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px}
.scorebtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.hero{background:var(--greenbg);border-color:transparent}
.sec{font-size:14px;font-weight:700;color:var(--mu);margin:20px 2px 8px}
.li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd);font-size:16px}
.li:last-child{border-bottom:0}.li>span:first-child{color:var(--mu)}.li.t>span{font-weight:700;color:var(--tx)}.li.t>span.green{color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.chart{display:flex;align-items:flex-end;gap:4px;height:64px;margin-top:16px}.chart i{flex:1;background:var(--green);opacity:.35;border-radius:3px 3px 0 0}.chart i:last-child{opacity:.9}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--green)}
.cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--bd);z-index:6}
.cta .in{max-width:608px;margin:auto;display:flex;gap:8px}.cta .btn.s{flex:1}
/* settings */
.set{padding:14px 0;border-bottom:1px solid var(--bd)}.set:last-child{border-bottom:0}
input[type=range]{width:100%;height:44px;accent-color:var(--btn);margin:0}
.tick{display:flex;align-items:center;gap:12px;min-height:52px;width:100%;text-align:left;font-size:16px;border-bottom:1px solid var(--bd)}
.list .tick:last-child{border-bottom:0}.tick.dim{color:var(--mu)}
.tb{width:24px;height:24px;border-radius:7px;border:2px solid var(--bd);display:grid;place-items:center;flex:none}
.tb.on{background:var(--btn);border-color:var(--btn)}.tb.on::after{content:"";width:6px;height:11px;border:solid var(--onbtn);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.soon{font-size:12px;font-weight:600;color:var(--mu);border:1px solid var(--bd);border-radius:99px;padding:2px 10px}
.sw{width:52px;height:32px;border-radius:99px;background:var(--bd);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--btn)}.sw.on::after{left:23px}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--brand);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;color:var(--navmu);min-height:64px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
nav button.on{color:var(--navac)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* onboarding, sheets, toast */
.ob{min-height:calc(100vh - 26px);display:flex;flex-direction:column}
.ob main{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%}
.obb{padding:0 16px 24px;max-width:640px;margin:0 auto;width:100%}
.ob .deal{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.dots{display:flex;gap:6px;justify-content:center;margin:16px 0}.dots i{width:8px;height:8px;border-radius:9px;background:var(--bd)}.dots i.on{background:var(--green);width:22px}
.notif .t16{margin-top:4px}
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,25,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:20px 20px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto;max-width:640px;margin:auto}
.grab{width:40px;height:5px;border-radius:9px;background:var(--bd);margin:4px auto 14px}
.opt{display:block;width:100%;text-align:left;min-height:52px;padding:0 4px;font-size:16px;border-bottom:1px solid var(--bd)}.opt.on{color:var(--green);font-weight:700}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---------------- example deals (made up for the demo; the maths is real) ----------------
const OUT = 6.30;                                                     // your postage & packing to the buyer
const fee = (x) => Math.round((x * 0.128 + 0.40) * 100) / 100;       // eBay selling fee estimate (business seller)
const gbp = (x) => "£" + (Math.round(x * 100) / 100).toFixed(2).replace(/\.00$/, "");
const gbp0 = (x) => "£" + Math.round(x);
const sgn = (x) => (x < 0 ? "−" : "+") + gbp0(Math.abs(x));
const CATS = [["phones","Phones"],["tablets","Tablets & e-readers"],["laptops","Laptops"],["desktops","Desktop PCs"],["gpus","Graphics cards"],["cpus","Processors (CPUs)"],["ram","Memory (RAM)"],["ssd","SSDs"],["monitors","Monitors"],["consoles","Games consoles"],["trainers","Trainers"]];
const SOON = ["Cameras & lenses","Headphones & AirPods","Smartwatches","LEGO","Power tools","Dyson","Steam Deck & handhelds"];
const CATNAME = Object.fromEntries(CATS);
const DEALS = [
 {type:"BIN",cat:"phones",title:"Apple iPhone 13 128GB Midnight Unlocked",cond:"Used",price:215,ship:3.5,sells:300,low:275,lo:280,hi:315,n:42,forSale:18,perWeek:9.8,trend:"Steady",score:84,mins:4,tags:["New listing","Best Offer"],seller:"techclearance_uk",fb:"99.6% · 1,240",loc:"Leeds",desc:"Fully working, screen protector fitted from new. Light marks on the back. Battery health 86%. Original box and cable."},
 {type:"AUC",cat:"gpus",title:"MSI GeForce RTX 3060 Ventus 2X 12GB",cond:"Used",price:120,ship:5,sells:210,low:190,lo:195,hi:225,n:31,forSale:24,perWeek:7.2,trend:"Steady",score:78,mins:12,endsMin:25,bids:4,tags:["Ends soon"],seller:"pcparts_mike",fb:"100% · 312",loc:"Bristol",desc:"Removed from a working gaming PC. Never mined. Tested before removal, no artifacts. Well packed."},
 {type:"BIN",cat:"laptops",title:"Lenovo ThinkPad T14 Gen 2 i5-1135G7 16GB 256GB SSD",cond:"Used",price:229,ship:0,sells:315,low:285,lo:290,hi:340,n:19,forSale:31,perWeek:4.4,trend:"Rising",score:72,mins:19,tags:["Free postage"],seller:"office_refurbs",fb:"99.1% · 5,410",loc:"Manchester",desc:"Ex-office laptop, Windows 11 Pro installed. Minor wear on lid. Battery holds about 4 hours. Charger included."},
 {type:"BIN",cat:"consoles",title:"Sony PlayStation 5 Disc Edition 825GB + Controller",cond:"Used",price:260,ship:8,sells:345,low:320,lo:325,hi:360,n:64,forSale:40,perWeek:14.9,trend:"Falling",score:69,mins:33,tags:["Prices falling"],seller:"gamer_dad_88",fb:"100% · 54",loc:"Newcastle",desc:"Works perfectly, selling as I don't use it. One controller, all cables, original box."},
 {type:"BIN",cat:"ram",title:"Corsair Vengeance LPX 32GB (2x16GB) DDR4 3200",cond:"Used",price:38,ship:2.9,sells:72,low:65,lo:66,hi:78,n:56,forSale:22,perWeek:13,trend:"Steady",score:81,mins:41,tags:[],seller:"upgrade_leftovers",fb:"99.8% · 2,004",loc:"Birmingham",desc:"Pulled from a working system after an upgrade. Passed MemTest. Posted in anti-static bags."},
 {type:"AUC",cat:"tablets",title:"Apple iPad Air 4th Gen 64GB Wi-Fi Space Grey",cond:"Used",price:140,ship:4.2,sells:255,low:225,lo:230,hi:270,n:7,forSale:15,perWeek:1.6,trend:"Steady",score:52,mins:58,endsMin:190,bids:1,tags:["Few sales"],seller:"clearout_2026",fb:"100% · 12",loc:"Cardiff",desc:"Works fine. Some scratches on the screen, not visible when on. No charger."},
 {type:"BIN",cat:"trainers",title:"Nike Air Max 90 White UK 9",cond:"New with box",price:58,ship:4,sells:105,low:95,lo:96,hi:115,n:23,forSale:12,perWeek:5.4,trend:"Steady",score:74,mins:75,tags:["Misspelt title"],seller:"shoe_swap_uk",fb:"98.7% · 230",loc:"London",desc:"Brand new, wrong size gift. Never worn, box has a small dent."},
 {type:"AUC",cat:"monitors",title:"Dell UltraSharp U2720Q 27\" 4K USB-C Monitor",cond:"Used",price:95,ship:0,sells:230,low:205,lo:210,hi:250,n:17,forSale:9,perWeek:4,trend:"Rising",score:76,mins:96,endsMin:720,bids:0,tags:["Collection only","Ends overnight"],seller:"wfh_clearout",fb:"100% · 41",loc:"Gateshead · 3 miles",desc:"Perfect working order, no dead pixels. Stand and cables included. Collection only."},
];
DEALS.forEach((d, i) => {
  d.id = i; d.cost = d.price + d.ship;
  d.mostTotal = d.sells - fee(d.sells) - OUT - 10;                         // most you can pay in total and still make £10
  if (d.type === "AUC") {
    d.maxBid = Math.floor(Math.min(d.mostTotal, d.low - fee(d.low) - OUT) - d.ship);   // and no loss at the low end
    d.profitMax = d.sells - fee(d.sells) - OUT - (d.maxBid + d.ship);
    d.profitNow = d.sells - fee(d.sells) - OUT - d.cost;
    d.profit = d.profitMax;
  } else {
    d.profit = d.sells - fee(d.sells) - OUT - d.cost;
    d.lowProfit = d.low - fee(d.low) - OUT - d.cost;
  }
  const base = d.type === "AUC" ? d.maxBid + d.ship : d.cost;
  d.ret = Math.round(d.profit / (base + 1.3) * 100);
  d.days = Math.max(1, Math.round(d.forSale / d.perWeek * 7));
  d.parts = { Evidence: Math.min(25, Math.round(d.n / 2)), Match: d.score > 60 ? 18 : 12, Seller: d.fb.startsWith("100") || d.fb.startsWith("99") ? 14 : 9, Margin: Math.min(20, Math.round(d.profit / 2)), Competition: d.type === "AUC" && d.bids < 2 ? 9 : 6, Demand: d.perWeek > 8 ? 10 : d.perWeek > 3 ? 7 : 4 };
});
const word = (s) => s >= 70 ? "Strong" : s >= 50 ? "Fair" : "Risky";
const scol = (s) => s >= 70 ? "var(--scOk)" : s >= 50 ? "var(--scWarn)" : "var(--scBad)";
const pcol = (s) => s >= 70 ? "var(--pB)" : s >= 50 ? "var(--pA)" : "var(--pR)";
const ago = (m) => m < 60 ? m + " min ago" : Math.round(m / 60) + " h ago";
const ends = (m) => m < 60 ? m + " min" : Math.floor(m / 60) + " h " + (m % 60 ? (m % 60) + " min" : "");
const TAGS = {"New listing":"Listed in the last hour, so few people have seen it yet.","Best Offer":"The seller accepts offers, so you may get it for less.","Ends soon":"This auction ends soon — set your max bid now.","Free postage":"No postage to pay on top of the price.","Prices falling":"Sold prices for this have been going down lately. Sell quickly.","Few sales":"The sell price comes from fewer than 10 sales, so it's less certain. Check sold prices first.","Misspelt title":"The title has a typo, so most people searching won't find it.","Collection only":"You collect it in person. Often cheaper because fewer people can buy it.","Ends overnight":"Ends between midnight and 6am, when fewer people are bidding."};
const tagCls = (t) => /falling|Few/.test(t) ? "wc" : /New|Best|Misspelt|Free/.test(t) ? "okc" : "";

// ---------------- state + helpers ----------------
const S = { scr: "ob1", preview: false, f: "all", sort: "best", deal: 0, cats: Object.fromEntries(CATS.map(([k]) => [k, true])), spend: 300, minProfit: 10, collect: true, miles: 15, quiet: true, limit: 20, adv: false, seller: "business", post: 5, pack: 1.3, follow: {}, hidden: {} };
const $ = (id) => document.getElementById(id), app = $("app");
function go(scr, x) { Object.assign(S, x || {}, { scr }); render(); scrollTo(0, 0); }
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }
function sheet(html, close = "Close") { closeSheet(); const b = document.createElement("div"); b.id = "sh"; b.innerHTML = `<div class="sheet-bg" onclick="closeSheet()"></div><div class="sheet"><div class="grab"></div>${html}${close ? `<button class="btn s" style="margin-top:16px" onclick="closeSheet()">${close}</button>` : ""}</div>`; document.body.appendChild(b); }
function closeSheet() { const s = $("sh"); if (s) s.remove(); }
const IC = {
  deals: '<svg viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0L3 13V3h10l7.6 7.6a2 2 0 010 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
  follow: '<svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 003.4 0"/></svg>',
  settings: '<svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
  account: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  back: '<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  more: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
  info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h0"/></svg>',
};
const demo = '<div class="demo">Demo · example deals, not real listings</div>';
const head = (right) => `<div class="brandbar"><header><div class="brand">Flip<b>timize</b></div>${right || ""}</header></div>`;
const nav = (on) => `<nav>${[["deals","Deals"],["follow","Following"],["settings","Settings"],["account","Account"]].map(([k, l]) => `<button class="${on === k ? "on" : ""}" onclick="go('${k}')">${IC[k]}<span>${l}</span></button>`).join("")}</nav>`;
const dots = (i) => `<div class="dots">${[1,2,3].map((n) => `<i class="${n === i ? "on" : ""}"></i>`).join("")}</div>`;
const scoreTxt = (d) => `<span class="score ${d.score >= 70 ? "s1" : d.score >= 50 ? "s2" : "s3"}">${word(d.score)} · ${d.score}</span>`;

// ---------------- slim deal row ----------------
function row(d) {
  const auc = d.type === "AUC";
  return `<div class="deal" role="button" tabindex="0" onclick="go('deal',{deal:${d.id}})">
   <div class="thumb">Photo</div>
   <div class="dmid">
    <div class="dtitle">${d.title}</div>
    <div class="dsub">${auc ? `<span class="lab">Auction</span> Bid up to <b>${gbp0(d.maxBid)}</b> · ends ${ends(d.endsMin)}` : `Buy <b>${gbp(d.price)}</b>${d.ship ? "" : " · free post"}`}</div>
    <div class="dmeta">${scoreTxt(d)}<span>· ${ago(d.mins)}</span></div>
   </div>
   <div class="dright"><div class="profit">+${gbp0(d.profit)}</div><div class="plab">profit</div>
    ${S.preview ? "" : `<button class="more" aria-label="More options" onclick="event.stopPropagation();moreSheet(${d.id})">${IC.more}</button>`}</div>
  </div>`;
}
function moreSheet(i) {
  const d = DEALS[i];
  sheet(`<div class="t16 b" style="margin-bottom:12px">${d.title}</div>
   <button class="btn" onclick="S.follow[${i}]=!S.follow[${i}];closeSheet();toast(S.follow[${i}]?'Following — we\\'ll alert you before it ends or if the price drops':'Unfollowed');render()">${S.follow[i] ? "Unfollow" : "Follow this deal"}</button>
   <button class="btn s" style="margin-top:10px" onclick="S.hidden[${i}]=1;closeSheet();toast('Hidden. You won\\'t see this deal again.');render()">Hide this deal</button>`, "Cancel");
}
function scoreSheet(i) {
  const d = DEALS[i], max = { Evidence: 25, Match: 20, Seller: 15, Margin: 20, Competition: 10, Demand: 10 };
  const why = { Evidence: d.n + " sales in 30 days behind the price", Match: "How sure we are it's the same model", Seller: "Feedback " + d.fb, Margin: "Profit even at the low end", Competition: d.type === "AUC" ? d.bids + " bids so far" : "Listed " + ago(d.mins), Demand: "About " + d.perWeek + " sell each week" };
  sheet(`<div class="t20 b">Deal score ${d.score} · ${word(d.score)}</div><p class="mu t14" style="margin:4px 0 6px">How strong this deal looks, from six checks. Not a promise of profit — always read the listing.</p>
  ${Object.keys(max).map((k) => `<div style="margin:12px 0"><div class="spread b t14"><span>${k}</span><span class="num">${Math.min(d.parts[k], max[k])}/${max[k]}</span></div><div class="bar"><i style="width:${Math.min(100, d.parts[k] / max[k] * 100)}%"></i></div><div class="mu t12">${why[k]}</div></div>`).join("")}`);
}
const SORTS = { best: "Best score", profit: "Most profit", ending: "Ending soon", newest: "Newest" };
function sortSheet() { sheet('<div class="t20 b" style="margin-bottom:8px">Sort deals</div>' + Object.entries(SORTS).map(([k, l]) => `<button class="opt ${S.sort === k ? "on" : ""}" onclick="S.sort='${k}';closeSheet();render()">${l}</button>`).join(""), "Cancel"); }
function tagSheet(t) { sheet(`<div class="t20 b">${t}</div><p class="t16">${TAGS[t] || ""}</p>`); }
const tagBtns = (d) => d.tags.length ? `<div class="chips" style="padding:0;margin:12px 0 0;flex-wrap:wrap">${d.tags.map((t) => `<button class="chip ${/falling|Few/.test(t) ? "w" : ""}" onclick="tagSheet('${t}')">${t}</button>`).join("")}</div>` : "";

// ---------------- screens ----------------
const SCR = {
 ob1: () => `${demo}<div class="ob">${head()}<main>
   <div class="t28 b" style="line-height:1.15">Profitable eBay deals, sent to your phone.</div>
   <p class="mu t16" style="margin:12px 0 20px">Fliptimize scans eBay UK for things you can buy cheap and resell. It works out the profit after fees and postage, and tells you the most to pay.</p>
   ${row(DEALS[0]).replace(/<button class="more"[\s\S]*?<\/button>/, "").replace('onclick="go(\'deal\',{deal:0})"', "")}
   <p class="mu t14" style="text-align:center;margin-top:8px">An example of what you'll get</p></main>
   <div class="obb">${dots(1)}<button class="btn" onclick="go('deals',{preview:true})">See example deals</button><button class="btn link" onclick="go('ob2')">I already have an account</button></div></div>`,
 ob2: () => `${demo}<div class="ob">${head()}<main><div class="t28 b">What do you want deals on?</div><p class="mu t16" style="margin:8px 0 16px">All ticked to start. You can change this any time.</p>
   <div class="card list">${CATS.map(([k, l]) => tick(k, l)).join("")}</div>
   <div class="card">${slider("spend", "Most I'll spend on one item", 50, 1500, 25, "£")}</div></main>
   <div class="obb">${dots(2)}<button class="btn" onclick="go('ob3')">Next</button></div></div>`,
 ob3: () => `${demo}<div class="ob">${head()}<main><div class="t28 b">Turn on alerts</div><p class="mu t16" style="margin:8px 0 16px">Good deals go fast. An alert lets you see them before other buyers do.</p>
   <div class="card notif"><div class="spread mu t12"><span>Fliptimize</span><span>now</span></div><div class="t16 b">£36 profit · iPhone 13 128GB</div><div class="mu t14">Buy It Now £215 · sells for about £300</div></div>
   <p class="mu t14">Only Strong and Fair deals. Never more than your daily limit, and nothing during quiet hours.</p></main>
   <div class="obb">${dots(3)}<button class="btn" onclick="toast('Your phone would now ask: Allow notifications?');setTimeout(()=>go('deals',{preview:false}),1000)">Allow alerts</button><button class="btn link" onclick="go('deals',{preview:false})">Not now</button></div></div>`,
 deals: () => {
  let L = DEALS.filter((d) => !S.hidden[d.id] && S.cats[d.cat] && (S.f === "all" || (S.f === "col" ? d.tags.includes("Collection only") : d.type === S.f)));
  const k = { best: (d) => d.score, profit: (d) => d.profit, ending: (d) => -(d.endsMin || 1e9), newest: (d) => -d.mins }[S.sort]; L = [...L].sort((a, b) => k(b) - k(a));
  if (S.preview) L = L.slice(0, 4);
    return `${demo}${head(`<span class="hsub">${S.preview ? "Examples" : "Updated 1 min ago"}</span>`)}<main>
   ${S.preview ? "" : `<div class="chips">${[["all","All"],["BIN","Buy It Now"],["AUC","Auctions"],["col","Collection"]].map(([v, l]) => `<button class="chip ${S.f === v ? "on" : ""}" onclick="S.f='${v}';render()">${l}</button>`).join("")}</div>
   <div class="spread" style="margin:4px 2px 8px"><span class="mu t14">${L.length} deals</span><button class="sortb" onclick="sortSheet()">Sort: <b>${SORTS[S.sort]}</b> ▾</button></div>`}
   <div class="card list rows">${L.map(row).join("") || '<p class="mu" style="padding:16px">No deals match. Tick more categories in Settings.</p>'}</div>
   ${S.preview ? `<div class="card" style="text-align:center"><div class="t20 b">Get deals like these</div><p class="mu t14" style="margin:6px 0 14px">Free to try. Takes 30 seconds.</p><button class="btn" onclick="go('ob2')">Create account</button></div>` : ""}
  </main>${S.preview ? "" : nav("deals")}`;
 },
 deal: () => {
  const d = DEALS[S.deal], auc = d.type === "AUC";
  const bars = [6,8,7,9,11,8,10,12,9,11,10,13].map((h) => `<i style="height:${h * 7}%"></i>`).join("");
  return `${demo}<div class="topbar"><button class="iconb" aria-label="Back" onclick="go('deals')">${IC.back}</button><span class="mu t14">Found ${ago(d.mins)}</span><button class="iconb" aria-label="More options" onclick="moreSheet(${d.id})">${IC.more}</button></div>
  <main style="padding-bottom:120px">
   <div class="gal"><div>Photo 1 of 8</div><div>Photo 2 of 8</div><div>Photo 3 of 8</div></div>
   <div class="t20 b" style="line-height:1.3">${d.title}</div>
   <div class="mu t14" style="margin:4px 0 8px">${auc ? '<span class="lab">Auction</span> ' : ""}${d.cond} · ${CATNAME[d.cat]} · ${d.loc}</div>
   <button class="scorebtn" onclick="scoreSheet(${d.id})">${scoreTxt(d)} <span class="mu t12" style="display:inline-flex;align-items:center;gap:3px">${IC.info}what's this?</span></button>
   <div class="card hero">
    <div class="mu t14">${auc ? "Profit if you win at your max bid" : "Expected profit"}</div>
    <div class="t28 b green num">${gbp(d.profit)}</div>
    <div class="t14">${auc ? `Bid up to <b>${gbp0(d.maxBid)}</b> <span class="mu">· now ${gbp(d.price)}, ${d.bids || "no"} bid${d.bids === 1 ? "" : "s"}, ends in ${ends(d.endsMin)}</span>` : `Buy now <b>${gbp(d.price)}</b> <span class="mu">· pay no more than ${gbp0(Math.floor(d.mostTotal))} in total</span>`}</div>
   </div>
   <div class="sec">The money</div>
   <div class="card list">
    <div class="li"><span>${auc ? "Max bid + postage" : "Price + postage"}</span><span class="num">${gbp(auc ? d.maxBid + d.ship : d.cost)}</span></div>
    <div class="li"><span>Sells for about</span><span class="num">${gbp(d.sells)}</span></div>
    <div class="li"><span>eBay fees when you sell</span><span class="num">−${gbp(fee(d.sells))}</span></div>
    <div class="li"><span>Postage & packing out</span><span class="num">−${gbp(OUT)}</span></div>
    <div class="li t"><span>Profit</span><span class="num green">${gbp(d.profit)}</span></div>
    <div class="li"><span>${auc ? "If you win at today's bid" : "If it sells at the low end"}</span><span class="num">${gbp(auc ? d.profitNow : d.lowProfit)}</span></div>
   </div>
   <div class="sec">How well it sells</div>
   <div class="card"><div class="stats"><div><div class="t20 b num">${d.n}</div><div class="mu t12">sold in 30 days</div></div><div><div class="t20 b num">${d.forSale}</div><div class="mu t12">for sale now</div></div><div><div class="t20 b num">~${d.days} days</div><div class="mu t12">to sell</div></div></div>
    <div class="chart">${bars}</div><div class="spread mu t12" style="margin-top:4px"><span>12 weeks ago</span><span>sales per week</span><span>now</span></div>
    <p class="t14" style="margin:12px 0 0">Most sold for <b>${gbp0(d.lo)}–${gbp0(d.hi)}</b>. Prices ${d.trend.toLowerCase()}.</p>${tagBtns(d)}</div>
   <div class="sec">From the listing</div>
   <div class="card t16">${d.desc}</div>
   <div class="card list"><div class="li"><span>Seller</span><span>${d.seller}</span></div><div class="li"><span>Feedback</span><span>${d.fb}</span></div><div class="li"><span>Location</span><span>${d.loc}</span></div></div>
   <button class="btn link" onclick="toast('Thanks — this helps Fliptimize get better.')">Report a wrong deal</button>
  </main>
  <div class="cta"><div class="in"><button class="btn s" onclick="S.follow[${d.id}]=!S.follow[${d.id}];render();toast(S.follow[${d.id}]?'Following':'Unfollowed')">${S.follow[d.id] ? "Following" : "Follow"}</button><button class="btn" style="flex:2" onclick="toast('This would open the listing in the eBay app')">Open on eBay</button></div></div>`;
 },
 follow: () => { const L = DEALS.filter((d) => S.follow[d.id]);
  return `${demo}${head(`<span class="hsub">Following</span>`)}<main><p class="mu t16" style="margin:4px 2px 12px">We'll alert you when an auction is about to end, or if the price drops.</p>${L.length ? `<div class="card list rows">${L.map(row).join("")}</div>` : '<div class="card mu t16">Nothing yet. Tap ⋯ on any deal, then Follow.</div>'}</main>${nav("follow")}`; },
 settings: () => `${demo}${head(`<span class="hsub">Settings</span>`)}<main>
  <div class="sec">Categories · ${CATS.filter(([k]) => S.cats[k]).length} of ${CATS.length}</div>
  <div class="card list">${CATS.map(([k, l]) => tick(k, l)).join("")}${SOON.map((l) => `<div class="tick dim"><span class="tb"></span><span style="flex:1">${l}</span><span class="soon">Coming soon</span></div>`).join("")}</div>
  <div class="sec">Deals</div>
  <div class="card list">${slider("spend","Most I'll spend on one item",50,1500,25,"£")}${slider("minProfit","Minimum profit",5,100,5,"£")}
   <div class="set"><div class="spread"><div><div class="t16 b">Collection deals</div><div class="mu t14">Collect in person — often cheaper</div></div><button class="sw ${S.collect ? "on" : ""}" role="switch" aria-checked="${S.collect}" onclick="S.collect=!S.collect;render()"></button></div>${S.collect ? slider("miles","Distance from NE9",1,50,1," miles",true) : ""}</div></div>
  <div class="sec">Alerts</div>
  <div class="card list"><div class="set"><div class="spread"><div><div class="t16 b">Quiet hours</div><div class="mu t14">${S.quiet ? "No alerts 11pm – 7am" : "Alerts any time"}</div></div><button class="sw ${S.quiet ? "on" : ""}" role="switch" aria-checked="${S.quiet}" onclick="S.quiet=!S.quiet;render()"></button></div></div>${slider("limit","Daily alert limit",5,50,5,"")}</div>
  <button class="btn link" onclick="S.adv=!S.adv;render()">${S.adv ? "Hide advanced settings" : "Advanced settings"}</button>
  ${S.adv ? `<div class="card list"><div class="set"><div class="t16 b">I sell as</div><div class="chips" style="padding:10px 0 0">${[["business","Business"],["private","Private"]].map(([v, l]) => `<button class="chip ${S.seller === v ? "on" : ""}" onclick="S.seller='${v}';render()">${l}</button>`).join("")}</div><div class="mu t14">Private sellers in the UK pay no eBay selling fee on most items.</div></div>${slider("post","My usual postage cost",0,20,0.5,"£")}${slider("pack","Packing per item",0,5,0.1,"£")}</div>` : ""}</main>${nav("settings")}`,
 account: () => `${demo}${head(`<span class="hsub">Account</span>`)}<main>
  <div class="card"><div class="mu t14">Your plan</div><div class="t20 b">Founding member</div><div class="mu t14">Price locked in while you stay subscribed · renews 28 Nov 2026</div></div>
  <div class="card list"><div class="li"><span>Deals sent this month</span><span class="num">146</span></div><div class="li"><span>Deals you opened</span><span class="num">38</span></div><div class="li"><span>Email</span><span>you@example.com</span></div></div>
  <button class="btn s" onclick="toast('Plan options would show here')">Change plan</button>
  <button class="btn s" style="margin-top:10px" onclick="toast('Help: hello@fliptimize.com')">Help & contact</button>
  <button class="btn link" onclick="go('ob1',{preview:false})">Log out</button>
  <p class="mu t12" style="margin:16px 4px">Not affiliated with eBay. Profit figures are estimates from recent sales, not guarantees. Items are not reserved for you.</p></main>${nav("account")}`,
};
function tick(k, l) { return `<button class="tick" role="checkbox" aria-checked="${S.cats[k]}" onclick="S.cats.${k}=!S.cats.${k};render()"><span class="tb ${S.cats[k] ? "on" : ""}"></span>${l}</button>`; }
function slider(key, label, min, max, step, unit, after) {
  const f = (v) => after ? v + unit : unit + (step < 1 ? (+v).toFixed(2) : v);
  const js = after ? `this.value+'${unit}'` : `'${unit}'+(${step}<1?(+this.value).toFixed(2):this.value)`;
  return `<div class="set"><div class="spread"><span class="t16 b">${label}</span><b class="green num t16">${f(S[key])}</b></div><input type="range" aria-label="${label}" min="${min}" max="${max}" step="${step}" value="${S[key]}" oninput="S.${key}=+this.value;this.previousElementSibling.querySelector('b').textContent=${js}"></div>`;
}
function render() { closeSheet(); app.innerHTML = SCR[S.scr](); }
render();
</script>
